<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Spy — Análisis de Competencia</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --border: #2a2d35;
    --accent: #ffe600;
    --accent2: #00e5a0;
    --danger: #ff4d6d;
    --text: #e8eaf0;
    --muted: #6b7280;
    --premium: #ffe600;
    --clasica: #6b7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -1px;
  }

  .logo span { color: var(--text); }

  .subtitle {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
  }

  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    border-radius: 4px;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  .limit-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 12px 10px;
    border-radius: 4px;
    cursor: pointer;
    outline: none;
  }

  button.search-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 4px;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  button.search-btn:hover { opacity: 0.85; }
  button.search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    min-height: 18px;
  }

  .status.loading { color: var(--accent2); }
  .status.error { color: var(--danger); }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
    display: none;
  }

  .progress-bar.active { display: block; }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 16px;
    flex: 1;
    min-width: 120px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--accent);
  }

  /* Table */
  .table-wrapper {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    border-bottom: 2px solid var(--accent);
  }

  th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 10px 12px;
    text-align: left;
    white-space: nowrap;
  }

  td {
    padding: 12px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  tr:hover td { background: rgba(255,255,255,0.02); }

  .title-cell {
    max-width: 220px;
    line-height: 1.4;
  }

  .title-link {
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
  }

  .title-link:hover { color: var(--accent); }

  .price {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    color: var(--accent2);
    white-space: nowrap;
  }

  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-premium { background: rgba(255,230,0,0.15); color: var(--premium); border: 1px solid rgba(255,230,0,0.3); }
  .badge-clasica { background: rgba(107,114,128,0.15); color: var(--clasica); border: 1px solid rgba(107,114,128,0.3); }

  .rep {
    font-size: 18px;
    line-height: 1;
  }

  .check { color: var(--accent2); font-size: 14px; }
  .cross { color: var(--danger); font-size: 14px; }

  .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .quality-score {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .q-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
  }

  .q-dot.filled { background: var(--accent2); }
  .q-dot.partial { background: var(--accent); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 2;
  }

  .empty-icon { font-size: 32px; margin-bottom: 12px; }

  @media (max-width: 600px) {
    .stat-card { min-width: 80px; }
    th, td { padding: 8px 8px; }
    .title-cell { max-width: 140px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">ML<span>spy</span></div>
    <div class="subtitle">análisis de competencia · mercado libre argentina</div>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="query" placeholder="ej: reposamuñecas ergonómico, taza térmica..." />
  <select class="limit-select" id="limitSelect">
    <option value="5">5 resultados</option>
    <option value="10" selected>10 resultados</option>
    <option value="20">20 resultados</option>
  </select>
  <button class="search-btn" id="searchBtn" onclick="buscar()">Buscar</button>
</div>

<div class="status" id="status">Ingresá una búsqueda para empezar.</div>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

<div id="statsRow" class="stats-row" style="display:none"></div>
<div class="table-wrapper"><div id="results"></div></div>

<script>
const API = 'https://api.mercadolibre.com';

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function showProgress(show) {
  document.getElementById('progressBar').className = 'progress-bar' + (show ? ' active' : '');
}

function formatPrice(n) {
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function repEmoji(level) {
  const map = {
    '1_red': '🔴',
    '2_orange': '🟠',
    '3_yellow': '🟡',
    '4_light_green': '🟢',
    '5_green': '🟢',
  };
  return map[level] || '⚪';
}

function repLabel(level) {
  const map = {
    '1_red': 'Roja',
    '2_orange': 'Naranja',
    '3_yellow': 'Amarilla',
    '4_light_green': 'Verde claro',
    '5_green': 'Verde',
  };
  return map[level] || 'N/D';
}

function listingType(id) {
  if (!id) return '<span class="badge badge-clasica">—</span>';
  if (id === 'gold_pro') return '<span class="badge badge-premium">Premium</span>';
  if (id === 'gold_special') return '<span class="badge badge-premium">Premium</span>';
  if (id === 'gold') return '<span class="badge badge-clasica">Clásica</span>';
  if (id === 'silver') return '<span class="badge badge-clasica">Clásica</span>';
  return '<span class="badge badge-clasica">' + id + '</span>';
}

function qualityDots(score, max=5) {
  let html = '<div class="quality-score">';
  for (let i = 0; i < max; i++) {
    html += `<div class="q-dot${i < score ? ' filled' : ''}"></div>`;
  }
  html += '</div>';
  return html;
}

function calcQuality(item) {
  let score = 0;
  if (item.pictures && item.pictures.length >= 3) score++;
  if (item.pictures && item.pictures.length >= 6) score++;
  if (item.plain_text && item.plain_text.length > 100) score++;
  if (item.accepts_mercadopago) score++;
  if (item.shipping && item.shipping.free_shipping) score++;
  return score;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('Error HTTP ' + r.status);
  return r.json();
}

async function buscar() {
  const q = document.getElementById('query').value.trim();
  if (!q) { setStatus('Escribí algo para buscar.', 'error'); return; }

  const limit = parseInt(document.getElementById('limitSelect').value);
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  document.getElementById('statsRow').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  showProgress(true);
  setProgress(5);
  setStatus('Buscando "' + q + '" en Mercado Libre...', 'loading');

  try {
    const search = await fetchJSON(`${API}/sites/MLA/search?q=${encodeURIComponent(q)}&limit=${limit}`);
    const items = search.results || [];

    if (items.length === 0) {
      setStatus('Sin resultados para "' + q + '".', 'error');
      showProgress(false);
      btn.disabled = false;
      return;
    }

    setStatus(`Encontré ${items.length} publicaciones. Cargando detalles...`, 'loading');
    setProgress(20);

    // Fetch item details + seller info in parallel batches
    const detailed = [];
    const batchSize = 5;

    for (let i = 0; i < items.length; i += batchSize) {
      const batch = items.slice(i, i + batchSize);
      const results = await Promise.all(batch.map(async (item) => {
        try {
          const [detail, seller] = await Promise.all([
            fetchJSON(`${API}/items/${item.id}`),
            fetchJSON(`${API}/users/${item.seller.id}`)
          ]);
          return { detail, seller };
        } catch {
          return { detail: item, seller: {} };
        }
      }));
      detailed.push(...results);
      setProgress(20 + Math.round(((i + batchSize) / items.length) * 70));
    }

    setProgress(100);
    setStatus(`${detailed.length} publicaciones analizadas.`, '');

    // Stats
    const prices = detailed.map(d => d.detail.price).filter(Boolean);
    const avgPrice = prices.reduce((a,b) => a+b, 0) / prices.length;
    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const premiumCount = detailed.filter(d => d.detail.listing_type_id === 'gold_pro' || d.detail.listing_type_id === 'gold_special').length;
    const freeShipCount = detailed.filter(d => d.detail.shipping && d.detail.shipping.free_shipping).length;

    document.getElementById('statsRow').style.display = 'flex';
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="stat-label">Precio mínimo</div><div class="stat-value" style="font-size:16px">${formatPrice(minPrice)}</div></div>
      <div class="stat-card"><div class="stat-label">Precio promedio</div><div class="stat-value" style="font-size:16px">${formatPrice(avgPrice)}</div></div>
      <div class="stat-card"><div class="stat-label">Precio máximo</div><div class="stat-value" style="font-size:16px">${formatPrice(maxPrice)}</div></div>
      <div class="stat-card"><div class="stat-label">Premium</div><div class="stat-value">${premiumCount}<span style="font-size:12px;color:var(--muted)">/${detailed.length}</span></div></div>
      <div class="stat-card"><div class="stat-label">Envío gratis</div><div class="stat-value">${freeShipCount}<span style="font-size:12px;color:var(--muted)">/${detailed.length}</span></div></div>
    `;

    // Table
    let html = `
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Precio</th>
            <th>Vendidos</th>
            <th>Stock</th>
            <th>Tipo</th>
            <th>Reputación</th>
            <th>Fotos</th>
            <th>Descripción</th>
            <th>Cuotas</th>
            <th>Envío gratis</th>
            <th>Calidad</th>
          </tr>
        </thead>
        <tbody>
    `;

    detailed.forEach(({ detail, seller }, i) => {
      const rep = seller.seller_reputation;
      const repLevel = rep && rep.level_id ? rep.level_id : null;
      const hasDesc = detail.descriptions && detail.descriptions.length > 0;
      // plain_text might not be available without extra call; use presence of descriptions
      const photoCount = detail.pictures ? detail.pictures.length : 0;
      const freeShip = detail.shipping && detail.shipping.free_shipping;
      const installments = detail.installments && detail.installments.quantity > 1;
      const sold = detail.sold_quantity != null ? detail.sold_quantity : '—';

      // Quality score based on available data
      let qScore = 0;
      if (photoCount >= 3) qScore++;
      if (photoCount >= 6) qScore++;
      if (hasDesc) qScore++;
      if (installments) qScore++;
      if (freeShip) qScore++;

      const mlUrl = `https://www.mercadolibre.com.ar/p/${detail.id}`;

      html += `
        <tr>
          <td class="num" style="color:var(--muted)">${i+1}</td>
          <td class="title-cell">
            <a class="title-link" href="${detail.permalink || mlUrl}" target="_blank">${detail.title || '—'}</a>
          </td>
          <td class="price">${detail.price ? formatPrice(detail.price) : '—'}</td>
          <td class="num">${sold}</td>
          <td class="num">${detail.available_quantity != null ? detail.available_quantity : '—'}</td>
          <td>${listingType(detail.listing_type_id)}</td>
          <td title="${repLabel(repLevel)}">${repEmoji(repLevel)} <span style="font-size:11px;color:var(--muted)">${repLabel(repLevel)}</span></td>
          <td class="num">${photoCount}</td>
          <td>${hasDesc ? '<span class="check">✓</span>' : '<span class="cross">✗</span>'}</td>
          <td>${installments ? '<span class="check">✓</span>' : '<span class="cross">✗</span>'}</td>
          <td>${freeShip ? '<span class="check">✓</span>' : '<span class="cross">✗</span>'}</td>
          <td>${qualityDots(qScore)}</td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    document.getElementById('results').innerHTML = html;
    showProgress(false);

  } catch (err) {
    setStatus('Error al conectar con la API: ' + err.message, 'error');
    showProgress(false);
  }

  btn.disabled = false;
}

// Enter key support
document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});
</script>
</body>
</html>
