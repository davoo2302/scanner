
<h2 class="sr-only">Terminal de escaneo de códigos QR y de barras con cámara</h2>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>

<style>
#scan-wrap { padding: 1rem 0; font-family: var(--font-sans); }
.stabs { display: flex; gap: 6px; margin-bottom: 1rem; }
.stab { flex:1; padding: 8px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
.stab.on { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); }
.panel { display: none; }
.panel.on { display: block; }

#cam-box { position: relative; background: #000; border-radius: var(--border-radius-lg); overflow: hidden; aspect-ratio: 4/3; }
#cam-video { width: 100%; height: 100%; object-fit: cover; display: block; }
#cam-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.finder { width: 55%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,0.6); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); }
#cam-canvas { display: none; }
#cam-status { margin-top: 10px; font-size: 13px; color: var(--color-text-secondary); text-align: center; min-height: 20px; }
#cam-result { margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--color-text-primary); text-align: center; min-height: 20px; word-break: break-all; }
.cam-btns { display: flex; gap: 8px; margin-top: 12px; }
.cam-btns button { flex: 1; }

.manual-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.manual-row input { flex: 1; }

.scan-list { display: flex; flex-direction: column; gap: 6px; margin-top: 1rem; max-height: 320px; overflow-y: auto; }
.scan-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); font-size: 13px; }
.scan-code { flex: 1; font-weight: 500; color: var(--color-text-primary); word-break: break-all; }
.scan-type { font-size: 11px; color: var(--color-text-secondary); }
.scan-time { font-size: 11px; color: var(--color-text-tertiary); white-space: nowrap; }
.dup-badge { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 4px; background: var(--color-background-danger); color: var(--color-text-danger); }

.stats-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 1rem; }
.stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; }
.stat-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
.stat-val { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }

.empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--color-text-tertiary); font-size: 13px; }
</style>

<div id="scan-wrap">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total escaneados</div>
      <div class="stat-val" id="st-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Duplicados</div>
      <div class="stat-val" id="st-dups">0</div>
    </div>
  </div>

  <div class="stabs">
    <button class="stab on" onclick="showTab('camera')"><i class="ti ti-camera" aria-hidden="true"></i> Cámara</button>
    <button class="stab" onclick="showTab('manual')"><i class="ti ti-keyboard" aria-hidden="true"></i> Manual</button>
    <button class="stab" onclick="showTab('history')"><i class="ti ti-list" aria-hidden="true"></i> Lista</button>
  </div>

  <div id="tab-camera" class="panel on">
    <div id="cam-box">
      <video id="cam-video" autoplay playsinline muted></video>
      <canvas id="cam-canvas"></canvas>
      <div id="cam-overlay"><div class="finder"></div></div>
    </div>
    <div id="cam-status">Tocá "Activar cámara" para empezar</div>
    <div id="cam-result">—</div>
    <div class="cam-btns">
      <button id="btn-start" onclick="startCam()">Activar cámara</button>
      <button id="btn-stop" onclick="stopCam()" style="display:none">Detener</button>
      <button onclick="exportCSV()">Exportar CSV</button>
    </div>
  </div>

  <div id="tab-manual" class="panel">
    <div class="manual-row">
      <input type="text" id="manual-input" placeholder="Escribí o pegá el código..." />
      <button onclick="addManual()">Agregar</button>
    </div>
    <p style="font-size:12px;color:var(--color-text-tertiary)">También podés conectar un lector USB/Bluetooth y escanear acá directamente.</p>
  </div>

  <div id="tab-history" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:13px;font-weight:500;color:var(--color-text-primary)" id="hist-label">Sin escaneos</span>
      <button onclick="clearAll()" style="font-size:12px">Limpiar todo</button>
    </div>
  </div>

  <div class="scan-list" id="scan-list">
    <div class="empty-state" id="empty-msg">Todavía no hay escaneos.<br>Activá la cámara o ingresá un código manualmente.</div>
  </div>
</div>

<script>
let scans = [];
let camStream = null;
let camInterval = null;
let lastCode = '';
let lastCodeTime = 0;

function showTab(t) {
  ['camera','manual','history'].forEach(id => {
    document.getElementById('tab-'+id).classList.toggle('on', id===t);
  });
  document.querySelectorAll('.stab').forEach((b,i) => {
    b.classList.toggle('on', ['camera','manual','history'][i]===t);
  });
  if (t !== 'camera') stopCam();
  if (t === 'manual') setTimeout(() => document.getElementById('manual-input').focus(), 50);
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function addScan(code, type) {
  code = code.trim();
  if (!code) return;
  const isDup = scans.some(s => s.code === code);
  const entry = { code, type: type||'manual', ts: Date.now(), dup: isDup };
  scans.unshift(entry);
  renderList();
  updateStats();
  document.getElementById('cam-result').textContent = (isDup ? '⚠ Duplicado: ' : '✓ ') + code;
  document.getElementById('cam-result').style.color = isDup ? 'var(--color-text-danger)' : 'var(--color-text-success)';
}

function renderList() {
  const list = document.getElementById('scan-list');
  const empty = document.getElementById('empty-msg');
  document.getElementById('hist-label').textContent = scans.length + ' escaneo' + (scans.length!==1?'s':'');
  if (!scans.length) {
    empty.style.display = 'block';
    list.querySelectorAll('.scan-item').forEach(e=>e.remove());
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = scans.slice(0,200).map(s => `
    <div class="scan-item">
      <div class="scan-code">${s.code}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
        <span class="scan-type">${s.type}</span>
        <span class="scan-time">${fmtTime(s.ts)}</span>
        ${s.dup ? '<span class="dup-badge">DUP</span>' : ''}
      </div>
    </div>`).join('');
}

function updateStats() {
  document.getElementById('st-total').textContent = scans.length;
  document.getElementById('st-dups').textContent = scans.filter(s=>s.dup).length;
}

function addManual() {
  const inp = document.getElementById('manual-input');
  addScan(inp.value, 'manual');
  inp.value = '';
  inp.focus();
}

document.getElementById('manual-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addManual();
});

function clearAll() {
  if (!confirm('¿Eliminar todos los escaneos?')) return;
  scans = [];
  renderList();
  updateStats();
  document.getElementById('cam-result').textContent = '—';
  document.getElementById('cam-result').style.color = '';
}

function exportCSV() {
  if (!scans.length) { alert('No hay escaneos para exportar.'); return; }
  const rows = ['CODIGO,TIPO,DUPLICADO,HORA'];
  scans.forEach(s => rows.push(`"${s.code}",${s.type},${s.dup?'SI':'NO'},${fmtTime(s.ts)}`));
  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'escaneos_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

async function startCam() {
  const status = document.getElementById('cam-status');
  status.textContent = 'Solicitando acceso a la cámara...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    camStream = stream;
    const video = document.getElementById('cam-video');
    video.srcObject = stream;
    await video.play();
    status.textContent = 'Cámara activa — apuntá al código';
    status.style.color = 'var(--color-text-success)';
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = '';
    startLoop();
  } catch(e) {
    status.textContent = 'Error: ' + (e.message || 'No se pudo acceder a la cámara');
    status.style.color = 'var(--color-text-danger)';
  }
}

function stopCam() {
  if (camInterval) { clearInterval(camInterval); camInterval = null; }
  if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
  const video = document.getElementById('cam-video');
  video.srcObject = null;
  document.getElementById('cam-status').textContent = 'Cámara detenida';
  document.getElementById('cam-status').style.color = '';
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-stop').style.display = 'none';
}

function startLoop() {
  const video = document.getElementById('cam-video');
  const canvas = document.getElementById('cam-canvas');
  const ctx = canvas.getContext('2d');

  camInterval = setInterval(() => {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    try {
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (typeof jsQR !== 'undefined') {
        const qr = jsQR(img.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
        if (qr && qr.data) {
          const now = Date.now();
          if (qr.data !== lastCode || now - lastCodeTime > 3000) {
            lastCode = qr.data; lastCodeTime = now;
            addScan(qr.data, 'QR');
          }
          return;
        }
      }

      if (typeof ZXing !== 'undefined') {
        try {
          const lum = new ZXing.RGBLuminanceSource(img.data, canvas.width, canvas.height);
          const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
          const reader = new ZXing.MultiFormatReader();
          const result = reader.decode(bmp);
          if (result) {
            const now = Date.now();
            const txt = result.getText();
            if (txt !== lastCode || now - lastCodeTime > 3000) {
              lastCode = txt; lastCodeTime = now;
              addScan(txt, 'barcode');
            }
          }
        } catch(ze) {}
      }
    } catch(e) {}
  }, 300);
}
</script>
