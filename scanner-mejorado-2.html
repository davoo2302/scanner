<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Logístico ML</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --border:   #1e1e2e;
    --accent:   #f0c040;
    --caba:     #60a5fa;
    --c1:       #34d399;
    --c2:       #a78bfa;
    --interior: #fb923c;
    --unknown:  #6b7280;
    --text:     #e2e8f0;
    --muted:    #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow Condensed', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 10px;
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
  }

  header span {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* ── CÁMARA: más grande ── */
  .cam-wrapper {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    /* 16:9 da más pantalla que 4:3 */
    aspect-ratio: 16 / 10;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* mira centrada sobre el CP */
  .cam-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .reticle {
    width: 82%;
    height: 42%;
    border: 2px solid var(--accent);
    border-radius: 4px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.38);
  }

  .reticle-label {
    position: absolute;
    top: calc(71% + 4px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 3px;
    opacity: 0.75;
  }

  canvas { display: none; }

  /* ── BOTONES ── */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 8px;
    margin-top: 8px;
  }

  button {
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }

  button:active { transform: scale(.97); opacity: .85; }

  #btn-start {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  #btn-start.active { color: var(--accent); border-color: var(--accent); }

  #btn-scan {
    background: var(--accent);
    color: #000;
    font-size: 18px;
  }

  #btn-scan:disabled { opacity: .35; cursor: not-allowed; }

  /* ── RESULTADO ── */
  .result-box {
    margin-top: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .result-zone {
    padding: 16px;
    text-align: center;
    background: var(--surface);
  }

  .zone-label {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1;
  }

  .zone-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 1px;
  }

  .zone-cp {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
  }

  /* spinner */
  .scanning {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px;
    background: var(--surface);
  }
  .scanning.active { display: flex; }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse {
    0%,100% { opacity:.2; transform:scale(.8); }
    50%      { opacity:1;  transform:scale(1.1); }
  }

  /* ── CONTEO ── */
  .counter-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    padding: 8px 14px 5px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  .counter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }

  .counter-cell {
    background: var(--bg);
    padding: 9px 13px;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .cdot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cname {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .3px;
    flex: 1;
    line-height: 1.2;
  }

  .cnum {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
  }

  /* reset */
  .btn-reset {
    width: 100%;
    margin-top: 8px;
    padding: 9px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-reset:hover { border-color: #f87171; color: #f87171; }

  /* colores */
  .z-CABA     { color: var(--caba); }
  .z-C1       { color: var(--c1); }
  .z-C2       { color: var(--c2); }
  .z-INTERIOR { color: var(--interior); }
  .z-UNKNOWN  { color: var(--unknown); }

  .d-CABA     { background: var(--caba); }
  .d-C1       { background: var(--c1); }
  .d-C2       { background: var(--c2); }
  .d-INTERIOR { background: var(--interior); }
</style>
</head>
<body>

<header>
  <h1>📦 SCANNER ML</h1>
  <span>ZONAS FLEX · CORREO AR</span>
</header>

<div class="cam-wrapper">
  <video id="video" autoplay playsinline muted></video>
  <div class="cam-overlay">
    <div class="reticle"></div>
  </div>
  <div class="reticle-label">CP · · ·</div>
</div>

<canvas id="canvas"></canvas>

<div class="btn-row">
  <button id="btn-start">📷 CÁMARA</button>
  <button id="btn-scan" disabled>⚡ ESCANEAR ZONA</button>
</div>

<div class="result-box">

  <div class="result-zone" id="result-zone">
    <div class="zone-label z-UNKNOWN" id="zone-label">— — —</div>
    <div class="zone-sub"  id="zone-sub"></div>
    <div class="zone-cp"   id="zone-cp">Apuntá la cámara al CP de la etiqueta</div>
  </div>

  <div class="scanning" id="scanning">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span style="font-size:12px;color:var(--muted);letter-spacing:2px">LEYENDO OCR…</span>
  </div>

  <div class="counter-title">CONTEO POR ZONA</div>
  <div class="counter-grid" id="counter-grid"></div>
</div>

<button class="btn-reset" id="btn-reset">↺ REINICIAR CONTEO</button>

<script>
// ─────────────────────────────────────────────────────────────
//  ZONAS — basadas en el PDF oficial de Correo Argentino
//  "Códigos postales habilitados PAQ.AR HOY"
// ─────────────────────────────────────────────────────────────

// Sets de CP exactos por zona (más confiable que rangos para GBA)
const CABA_SET = new Set([
  // Rangos CABA: 1000-1499 (todos), más 1500-1499 ya cubierto
  // Generamos el rango completo 1000-1499
  ...Array.from({length: 500}, (_, i) => 1000 + i)
]);

// Cordón 1 — fuente: Correo Argentino PDF
// San Martín, Vicente López, San Isidro, San Fernando (norte)
// 3 de Febrero, Hurlingham, Ituzaingó, Morón, La Matanza Norte (oeste)
// Avellaneda, Lanús, Lomas de Zamora (sur)
const C1_CPS = new Set([
  // Norte: San Martín, Vicente López, San Isidro, San Fernando
  1600,1601,1602,1603,1604,1605,1606,1607,1609,
  1624,1636,1637,1638,1640,1641,1642,1643,1644,
  1645,1646,1647,1648,1649,1650,1651,1653,1655,
  1672,1674,1675,
  // Oeste: 3 de Febrero, Hurlingham, Ituzaingó, Morón, La Matanza Norte
  1657,1676,1678,1682,1683,1684,1685,1686,1687,
  1688,1692,1702,1704,1706,1708,1712,1713,1714,
  1715,1754,1755,1765,1770,1773,1774,1778,
  // La Matanza Norte — localidades: Villa Luzuriaga, Ramos Mejía, San Justo, etc.
  1750,1751,1752,1753,1756,1757,1758,1759,
  1760,1761,1762,1763,1764,1766,1767,1768,1769,
  // Sur: Avellaneda, Lanús, Lomas de Zamora
  1820,1821,1822,1823,1824,1825,1826,1827,1828,
  1829,1831,1832,1833,1834,1836,1844,
  1868,1869,1870,1871,1872,1873,1874,1875
]);

// Cordón 2 — Tigre, Malvinas Argentinas, San Miguel, José C. Paz,
//             Moreno, Merlo, La Matanza Sur,
//             Ezeiza, Esteban Echeverría, Almirante Brown,
//             Quilmes, Florencio Varela, Berazategui
const C2_CPS = new Set([
  // Tigre, Malvinas Arg, San Miguel, José C. Paz
  1608,1610,1611,1612,1613,1614,1615,1616,1617,1618,1621,1659,1670,
  // Moreno, Merlo, La Matanza Sur
  1716,1718,1721,1722,1742,1743,1772,
  // Ezeiza, Esteban Echeverría, Alm. Brown, Quilmes, Florencio Varela, Berazategui
  1801,1802,1803,1804,1805,
  1838,1839,1840,1841,1842,1846,
  1852,1853,1854,1856,
  1878,1879,1880,1882,1884,1887
]);

const ZONAS = [
  { id: 'CABA', label: 'CABA',      sub: 'Ciudad Autónoma' },
  { id: 'C1',   label: 'CORDÓN 1',  sub: 'San Martín · Lanús · Morón · Avellaneda' },
  { id: 'C2',   label: 'CORDÓN 2',  sub: 'Quilmes · Moreno · Tigre · Ezeiza' },
  { id: 'INTERIOR', label: 'INTERIOR', sub: 'Resto del país' },
];

function detectarZona(cp) {
  if (CABA_SET.has(cp))  return 'CABA';
  if (C1_CPS.has(cp))    return 'C1';
  if (C2_CPS.has(cp))    return 'C2';
  // Interior: cualquier CP fuera de los sets anteriores
  // (incluye tercer cordón GBA y todo el interior del país)
  if (cp >= 1000 && cp <= 9999) return 'INTERIOR';
  return 'UNKNOWN';
}

// ─────────────────────────────────────────────────────────────
//  ESTADO
// ─────────────────────────────────────────────────────────────
let conteo = {};
try {
  conteo = JSON.parse(localStorage.getItem('ml-scanner-v2') || '{}');
} catch(e) {}

ZONAS.forEach(z => { if (!conteo[z.id]) conteo[z.id] = 0; });

function saveConteo() {
  try { localStorage.setItem('ml-scanner-v2', JSON.stringify(conteo)); } catch(e) {}
}

// ─────────────────────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const btnStart  = document.getElementById('btn-start');
const btnScan   = document.getElementById('btn-scan');
const btnReset  = document.getElementById('btn-reset');
const zoneLabel = document.getElementById('zone-label');
const zoneSub   = document.getElementById('zone-sub');
const zoneCp    = document.getElementById('zone-cp');
const scanning  = document.getElementById('scanning');
const resultZone= document.getElementById('result-zone');

function renderConteo() {
  document.getElementById('counter-grid').innerHTML = ZONAS.map(z => `
    <div class="counter-cell">
      <div class="cdot d-${z.id}"></div>
      <div class="cname z-${z.id}">${z.label}</div>
      <div class="cnum  z-${z.id}">${conteo[z.id] || 0}</div>
    </div>
  `).join('');
}

renderConteo();

// ─── CÁMARA ────────────────────────────────────────────────
btnStart.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    btnStart.textContent = '✓ ACTIVA';
    btnStart.classList.add('active');
    btnScan.disabled = false;
  } catch(e) {
    alert('No se pudo acceder a la cámara: ' + e.message);
  }
};

// ─── ESCANEAR ──────────────────────────────────────────────
btnScan.onclick = async () => {
  resultZone.style.display = 'none';
  scanning.classList.add('active');
  btnScan.disabled = true;

  // Capturar frame a buen tamaño
  const MAX_W = 1200;
  let w = video.videoWidth, h = video.videoHeight;
  if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);

  try {
    // Whitelist reducida: solo lo necesario para leer "CP: 1234"
    const { data: { text } } = await Tesseract.recognize(canvas, 'spa', {
      tessedit_char_whitelist: 'CPcp:0123456789 \n'
    });

    console.log('[OCR]', text);

    // Busca "CP:" seguido de 4 dígitos — ignora cualquier otro número
    const m = text.match(/[Cc][Pp][:\s]*(\d{4})/);
    const cp = m ? parseInt(m[1]) : null;
    const zona = cp ? detectarZona(cp) : 'UNKNOWN';
    const zonaData = ZONAS.find(z => z.id === zona);

    if (zona !== 'UNKNOWN') {
      conteo[zona] = (conteo[zona] || 0) + 1;
      saveConteo();
    }

    scanning.classList.remove('active');
    resultZone.style.display = '';

    zoneLabel.className = `zone-label z-${zona}`;
    zoneLabel.textContent = zonaData ? zonaData.label : '¿?';
    zoneSub.textContent   = zonaData ? zonaData.sub : '';
    zoneCp.textContent    = cp
      ? `CP ${cp} · ${zona !== 'UNKNOWN' ? '✓ registrado' : 'zona no mapeada'}`
      : 'CP no detectado — reintentá';

    renderConteo();
  } catch(e) {
    scanning.classList.remove('active');
    resultZone.style.display = '';
    zoneLabel.textContent = 'ERROR';
    zoneCp.textContent = e.message;
  }

  btnScan.disabled = false;
};

// ─── RESET ─────────────────────────────────────────────────
btnReset.onclick = () => {
  if (!confirm('¿Reiniciar conteo de todas las zonas?')) return;
  ZONAS.forEach(z => conteo[z.id] = 0);
  saveConteo();
  zoneLabel.className = 'zone-label z-UNKNOWN';
  zoneLabel.textContent = '— — —';
  zoneSub.textContent = '';
  zoneCp.textContent = 'Apuntá la cámara al CP de la etiqueta';
  renderConteo();
};
</script>
</body>
</html>
