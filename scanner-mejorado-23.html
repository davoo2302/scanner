<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Logístico ML</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body { font-family: Arial; background: #111827; color: white; padding: 10px; }
video { width: 100%; border-radius: 10px; }
canvas { display: none; }
button {
  width: 100%; padding: 14px; margin-top: 10px;
  border: none; border-radius: 10px;
  background: #2563eb; color: white; font-size: 18px; cursor: pointer;
}
#btn-auto.running { background: #ef4444; }
#resultado { margin-top: 15px; background: #1f2937; padding: 15px; border-radius: 10px; text-align: center; }
#conteo {
  margin-top: 10px; background: #1f2937; padding: 10px;
  border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.zona-cell {
  background: #111827; padding: 10px; border-radius: 8px;
  display: flex; justify-content: space-between; align-items: center; font-weight: bold;
}
.zona-num { font-size: 24px; }
.reset-btn { background: transparent !important; border: 1px solid #374151 !important; color: #6b7280 !important; font-size: 14px !important; }

/* ── RESUMEN ── */
#resumen-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#resumen-overlay.open { display: flex; }
.resumen-box {
  background: #1f2937;
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 380px;
}
.resumen-title {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #9ca3af;
  text-align: center;
  margin-bottom: 16px;
}
.resumen-total {
  text-align: center;
  font-size: 56px;
  font-weight: bold;
  color: #f0c040;
  line-height: 1;
}
.resumen-total-label {
  text-align: center;
  font-size: 13px;
  color: #6b7280;
  letter-spacing: 2px;
  margin-bottom: 20px;
  margin-top: 4px;
}
.resumen-fila {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #374151;
  font-size: 17px;
}
.resumen-fila:last-child { border-bottom: none; }
.resumen-pct {
  font-size: 12px;
  color: #6b7280;
  margin-left: 8px;
}
.resumen-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}
.resumen-btn {
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

/* ── TECLADO MANUAL ── */
#teclado-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
#teclado-overlay.open { display: flex; }
#teclado-display {
  font-size: 52px;
  font-weight: bold;
  letter-spacing: 12px;
  color: #f0c040;
  background: #1f2937;
  width: 280px;
  text-align: center;
  padding: 16px;
  border-radius: 12px;
  min-height: 80px;
}
#teclado-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 280px;
}
.tkey {
  background: #1f2937;
  color: white;
  font-size: 30px;
  font-weight: bold;
  padding: 20px 0;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
}
.tkey:active { background: #374151; transform: scale(0.95); }
.tkey.del    { background: #7f1d1d; font-size: 22px; }
.tkey.cancel { background: #374151; font-size: 18px; grid-column: span 2; }
</style>
</head>
<body>

<h2>📦 Scanner ML</h2>

<div style="position:relative;">
  <video id="video" autoplay playsinline></video>
  <div style="
    position:absolute; border:4px solid #22c55e;
    width:70%; height:30%; left:15%; top:35%;
    border-radius:12px; pointer-events:none;">
  </div>
  <div id="cam-status" style="
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.6); font-size:11px; letter-spacing:2px;
    padding:3px 12px; border-radius:20px; white-space:nowrap;">
    LISTO
  </div>
</div>

<canvas id="canvas"></canvas>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
  <button id="btn-start" style="margin-top:0">📷 Cámara</button>
  <button id="btn-auto"  style="margin-top:0" disabled>▶ Auto scan</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
  <button id="btn-manual" style="background:#7c3aed;margin-top:0">✏️ Manual</button>
  <button id="btn-resumen" style="background:#065f46;margin-top:0">📊 Resumen</button>
</div>

<!-- RESUMEN OVERLAY -->
<div id="resumen-overlay">
  <div class="resumen-box">
    <div class="resumen-title">📊 RESUMEN DEL DÍA</div>
    <div class="resumen-total" id="res-total">0</div>
    <div class="resumen-total-label">PAQUETES TOTALES</div>
    <div id="res-filas"></div>
    <div class="resumen-btns">
      <button class="resumen-btn" id="res-compartir" style="background:#25d366;color:#000">
        📤 WhatsApp
      </button>
      <button class="resumen-btn" id="res-cerrar" style="background:#374151;color:#fff">
        ✕ Cerrar
      </button>
    </div>
  </div>
</div>

<!-- TECLADO OVERLAY -->
<div id="teclado-overlay">
  <div style="color:#9ca3af;font-size:13px;letter-spacing:2px">INGRESÁ EL CP</div>
  <div id="teclado-display">_ _ _ _</div>
  <div id="teclado-grid">
    <button class="tkey" data-n="1">1</button>
    <button class="tkey" data-n="2">2</button>
    <button class="tkey" data-n="3">3</button>
    <button class="tkey" data-n="4">4</button>
    <button class="tkey" data-n="5">5</button>
    <button class="tkey" data-n="6">6</button>
    <button class="tkey" data-n="7">7</button>
    <button class="tkey" data-n="8">8</button>
    <button class="tkey" data-n="9">9</button>
    <button class="tkey del" id="tkey-del">⌫</button>
    <button class="tkey" data-n="0">0</button>
    <button class="tkey cancel" id="tkey-cancel">✕ Cancelar</button>
  </div>
</div>

<div id="resultado">Iniciá la cámara y presioná scan</div>
<div id="conteo"></div>
<button class="reset-btn" id="btn-reset">↺ Reiniciar conteo</button>

<script>
// ─── ZONAS ────────────────────────────────────────────────
const CABA_SET = new Set([...Array.from({length:500},(_,i)=>1000+i)]);

const C1_CPS = new Set([
  1600,1601,1602,1603,1604,1605,1606,1607,1609,
  1624,1636,1637,1638,1640,1641,1642,1643,1644,
  1645,1646,1647,1648,1649,1650,1651,1653,1655,1672,1674,1675,
  1657,1676,1678,1682,1683,1684,1685,1686,1687,
  1688,1692,1702,1704,1706,1708,1712,1713,1714,
  1715,1750,1751,1752,1753,1754,1755,1756,1757,1758,1759,
  1820,1821,1822,1823,1824,1825,1826,1827,1828,
  1829,1831,1832,1833,1834,1836,1844,
  1868,1869,1870,1871,1872,1873,1874,1875
]);

const C2_CPS = new Set([
  // La Matanza Sur (Laferrere, Virrey del Pino, Gonzalez Catan, etc)
  1760,1761,1762,1763,1764,1765,1766,1767,1768,1769,1770,1773,1774,1778,
  // Tigre, Malvinas Argentinas, San Miguel, Jose C Paz
  1608,1610,1611,1612,1613,1614,1615,1616,1617,1618,1621,1659,1670,
  // Grand Bourg, Tortuguitas, Don Torcuato, Bella Vista, Benavidez
  1611,1615,1669,1621,1622,1623,
  // Moreno, Merlo
  1716,1718,1721,1722,1742,1743,1772,
  // Ezeiza, Esteban Echeverria
  1801,1802,1803,1804,1805,
  // Almirante Brown
  1838,1839,1840,1841,1842,1846,
  // Quilmes
  1852,1853,1854,1855,1856,1857,1858,
  // Florencio Varela
  1878,1879,1880,1882,1884,1887,
  // Berazategui
  1884,1885,1886,1888,
  // Tristan Suarez (parte de Esteban Echeverria)
  1806,1807,
  // Pacheco (General Pacheco, parte de Tigre)
  1617,1618,1619,1620,
]);

const C3_CPS = new Set([
  // Pilar y alrededores (Derqui, Del Viso, Villa Rosa)
  1629,1630,1631,1632,1633,1634,1635,1636,
  // Escobar (Ing. Maschwitz, Benavidez, Nordelta)
  1625,1626,1627,1628,
  // Campana
  2804,2805,2806,
  // Zárate
  2820,2821,2822,
  // Marcos Paz
  1727,
  // General Rodríguez
  1748,1749,
  // Cañuelas
  1814,1815,
  // Guernica / San Vicente / Presidente Perón
  1810,1811,1812,1813,1816,1817,
  // La Plata completa (Norte, Centro, Oeste, alrededores)
  1900,1901,1902,1903,1904,1905,1906,1907,1908,1909,
  1910,1911,1912,1913,1914,1915,1916,1917,1918,1919,
  1920,1921,1922,1930,1931,1932,1933,1934,
  // Berisso
  1923,1924,
  // Ensenada
  1925,1926,
  // Garín (parte de Escobar)
  1626,1627,
  // Ingeniero Maschwitz
  1625,
]);

const ZONAS = [
  { id:'CABA', label:'CABA',     color:'#60a5fa' },
  { id:'C1',   label:'CORDÓN 1', color:'#34d399' },
  { id:'C2',   label:'CORDÓN 2', color:'#a78bfa' },
  { id:'C3',   label:'CORDÓN 3', color:'#f472b6' },
];

function detectarZona(cp) {
  if (CABA_SET.has(cp)) return 'CABA';
  if (C1_CPS.has(cp))   return 'C1';
  if (C2_CPS.has(cp))   return 'C2';
  // Todo lo demás es C3 — Flex no maneja Interior
  return 'C3';
}

// ─── CONTEO ───────────────────────────────────────────────
let conteo = {};
try { conteo = JSON.parse(localStorage.getItem('ml-v3') || '{}'); } catch(e){}
ZONAS.forEach(z => { if (!conteo[z.id]) conteo[z.id] = 0; });
function saveConteo() { try { localStorage.setItem('ml-v3', JSON.stringify(conteo)); } catch(e){} }
function renderConteo() {
  document.getElementById('conteo').innerHTML = ZONAS.map(z => `
    <div class="zona-cell">
      <span style="color:${z.color}">${z.label}</span>
      <span class="zona-num" style="color:${z.color}">${conteo[z.id]||0}</span>
    </div>`).join('');
}
renderConteo();

// ─── AUDIO ────────────────────────────────────────────────
let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 1046;
    g.gain.setValueAtTime(0.5, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch(e){}
}
function flash() {
  document.body.style.background = '#052e16';
  setTimeout(() => document.body.style.background = '#111827', 200);
}

// ─── ELEMENTOS ────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const resultado = document.getElementById('resultado');
const camStatus = document.getElementById('cam-status');

// ─── CÁMARA ───────────────────────────────────────────────
// Worker de Tesseract — se inicializa UNA SOLA VEZ y se reusa
let ocrWorker = null;
let workerReady = false;

async function initWorker() {
  ocrWorker = await Tesseract.createWorker('eng', 1, {
    logger: () => {} // silenciar logs internos
  });
  await ocrWorker.setParameters({
    tessedit_pageseg_mode:   '6',
    tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz:- '
  });
  workerReady = true;
  camStatus.textContent = 'LISTO';
  document.getElementById('btn-auto').disabled = false;
}

document.getElementById('btn-start').onclick = async () => {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment' }
    });
    camStatus.textContent = 'CARGANDO OCR…';
    document.getElementById('btn-start').textContent = '⏳ Cargando…';
    await initWorker();
    document.getElementById('btn-start').textContent = '✓ Listo';
  } catch(e) { alert('Error: ' + e.message); }
};

// ─── LOOP ─────────────────────────────────────────────────
let lastCP = null, pendingCP = null, noDetectCount = 0, loopActive = false, busy = false;

async function scanFrame() {
  if (!loopActive || busy) return;
  busy = true;

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !workerReady) { busy = false; setTimeout(scanFrame, 300); return; }

  // IGUAL QUE EL ORIGINAL: recorte 70% ancho 30% alto centrado
  const MAX_WIDTH = 900;
  let w = vw, h = vh;
  if (w > MAX_WIDTH) { h = h * MAX_WIDTH / w; w = MAX_WIDTH; }

  canvas.width  = w;
  canvas.height = h;

  const ctx      = canvas.getContext('2d');
  const cropW    = vw * 0.7;
  const cropH    = vh * 0.3;
  const cropX    = vw * 0.15;
  const cropY    = vh * 0.35;

  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, w, h);

  camStatus.textContent = 'ESCANEANDO…';

  try {
    if (!workerReady) { busy = false; setTimeout(scanFrame, 300); return; }
    const { data: { text } } = await ocrWorker.recognize(canvas);

    console.log('[OCR]', text);

    // El CP del remitente es SIEMPRE 1052 (Balvanera, fijo)
    const REMITENTE_CP = 1052;
    let cp = null;

    // Buscar todos los "CP:" en el texto, ignorar el del remitente
    const todosCP = [...text.matchAll(/[Cc][Pp][:\s]*(\d{4})/g)];
    for (const match of todosCP) {
      const val = parseInt(match[1]);
      if (val !== REMITENTE_CP) { cp = val; break; }
    }

    // Sin fallback — sin CP: en el texto no se detecta nada

    if (cp) {
      if (cp === lastCP) {
        // Misma etiqueta en cámara — no contar
        camStatus.textContent = 'ESPERANDO NUEVO…';
        noDetectCount = 0;
      } else {
        // CP nuevo — contar inmediatamente
        lastCP = cp;
        noDetectCount = 0;
        const zona  = detectarZona(cp);
        const zData = ZONAS.find(z => z.id === zona);
        if (zona) { conteo[zona] = (conteo[zona]||0) + 1; saveConteo(); }
        beep(); flash();
        camStatus.textContent = `✓ CP ${cp}`;
        resultado.innerHTML = `
          <div style="font-size:64px;font-weight:bold;color:${zData?.color||'#fff'};line-height:1">
            ${zData?.label||'?'}
          </div>
          <div style="font-size:30px;margin-top:14px;font-weight:bold">CP ${cp}</div>`;
        renderConteo();
      }
    } else {
      noDetectCount++;
      if (noDetectCount >= 3) {
        if (lastCP !== null) { lastCP = null; camStatus.textContent = 'LISTO'; }
        else camStatus.textContent = 'BUSCANDO…';
        noDetectCount = 0;
      }
    }
  } catch(e) { console.error(e); camStatus.textContent = 'ERROR'; }

  busy = false;
  if (loopActive) setTimeout(scanFrame, lastCP ? 800 : 150);
}

document.getElementById('btn-auto').onclick = function() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (!loopActive) {
    loopActive = true; lastCP = null; pendingCP = null; noDetectCount = 0;
    this.textContent = '⏹ Detener scan';
    this.classList.add('running');
    scanFrame();
  } else {
    loopActive = false; busy = false;
    this.textContent = '▶ Iniciar scan automático';
    this.classList.remove('running');
    camStatus.textContent = 'DETENIDO';
  }
};

document.getElementById('btn-reset').onclick = () => {
  if (!confirm('¿Reiniciar conteo?')) return;
  ZONAS.forEach(z => conteo[z.id] = 0);
  saveConteo(); lastCP = null; pendingCP = null; noDetectCount = 0;
  resultado.innerHTML = 'Conteo reiniciado';
  camStatus.textContent = 'LISTO';
  renderConteo();
};
// ── RESUMEN ─────────────────────────────────────────────
const resumenOverlay = document.getElementById('resumen-overlay');

function abrirResumen() {
  const total = ZONAS.reduce((s, z) => s + (conteo[z.id]||0), 0);
  document.getElementById('res-total').textContent = total;

  document.getElementById('res-filas').innerHTML = ZONAS.map(z => {
    const n   = conteo[z.id] || 0;
    const pct = total > 0 ? Math.round(n * 100 / total) : 0;
    return `
      <div class="resumen-fila">
        <span style="color:${z.color};font-weight:bold">${z.label}</span>
        <span>
          <span style="font-size:22px;font-weight:bold;color:${z.color}">${n}</span>
          <span class="resumen-pct">${pct}%</span>
        </span>
      </div>`;
  }).join('');

  resumenOverlay.classList.add('open');
}

document.getElementById('btn-resumen').onclick = abrirResumen;
document.getElementById('res-cerrar').onclick = () => resumenOverlay.classList.remove('open');

document.getElementById('res-compartir').onclick = () => {
  const total = ZONAS.reduce((s, z) => s + (conteo[z.id]||0), 0);
  const fecha = new Date().toLocaleDateString('es-AR');
  let msg = `📦 *RESUMEN FLEX — ${fecha}*
`;
  msg += `━━━━━━━━━━━━━━━━
`;
  ZONAS.forEach(z => {
    const n   = conteo[z.id] || 0;
    const pct = total > 0 ? Math.round(n * 100 / total) : 0;
    msg += `${z.label}: *${n}* paquetes (${pct}%)
`;
  });
  msg += `━━━━━━━━━━━━━━━━
`;
  msg += `*TOTAL: ${total} paquetes*`;
  const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
};

// ── TECLADO MANUAL ──────────────────────────────────────
const overlay  = document.getElementById('teclado-overlay');
const display  = document.getElementById('teclado-display');
let tecladoInput = '';

function updateDisplay() {
  const d = tecladoInput.padEnd(4, '_');
  display.textContent = d[0]+' '+d[1]+' '+d[2]+' '+d[3];
}

function tecladoRegistrar(cp) {
  const zona  = detectarZona(cp);
  const zData = ZONAS.find(z => z.id === zona);
  if (zona) { conteo[zona] = (conteo[zona]||0) + 1; saveConteo(); }
  beep(); flash();
  resultado.innerHTML = `
    <div style="font-size:64px;font-weight:bold;color:${zData?.color||'#fff'};line-height:1">
      ${zData?.label||'?'}
    </div>
    <div style="font-size:30px;margin-top:14px;font-weight:bold">CP ${cp}</div>
    <div style="font-size:13px;color:#9ca3af;margin-top:6px">✏️ ingresado manual</div>`;
  renderConteo();
  tecladoInput = '';
  overlay.classList.remove('open');
}

// Botones numéricos
document.getElementById('teclado-grid').addEventListener('click', e => {
  const btn = e.target.closest('.tkey');
  if (!btn) return;
  const n = btn.dataset.n;
  if (n !== undefined && tecladoInput.length < 4) {
    tecladoInput += n;
    updateDisplay();
    // Al completar 4 dígitos — registrar automáticamente
    if (tecladoInput.length === 4) {
      const cp = parseInt(tecladoInput);
      setTimeout(() => tecladoRegistrar(cp), 200); // pequeño delay visual
    }
  }
});

document.getElementById('tkey-del').onclick = () => {
  tecladoInput = tecladoInput.slice(0, -1);
  updateDisplay();
};

document.getElementById('tkey-cancel').onclick = () => {
  tecladoInput = '';
  overlay.classList.remove('open');
};

document.getElementById('btn-manual').onclick = () => {
  tecladoInput = '';
  updateDisplay();
  overlay.classList.add('open');
};
</script>
</body>
</html>
