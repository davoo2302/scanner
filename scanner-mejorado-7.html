<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner ML</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body {
  font-family: Arial;
  background: #111827;
  color: white;
  padding: 10px;
  overflow: hidden;
}
video {
  width: 100%;
  border-radius: 10px;
  object-fit: cover;
}
canvas { display: none; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
#btn-auto.running { background: #ef4444; }
#resultado {
  margin-top: 15px;
  background: #1f2937;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  min-height: 80px;
}
#conteo {
  margin-top: 10px;
  background: #1f2937;
  padding: 10px;
  border-radius: 10px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.zona-cell {
  background: #111827;
  padding: 10px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: bold;
}
.zona-num { font-size: 24px; }
.reset-btn {
  background: transparent !important;
  border: 1px solid #374151 !important;
  color: #6b7280 !important;
  font-size: 14px !important;
  padding: 8px !important;
}
</style>
</head>
<body>

<h2>📦 Scanner ML</h2>

<div style="position:relative;">
  <video id="video" autoplay playsinline></video>

  <!-- Recuadro ajustado al recorte real -->
  <div style="
    position:absolute;
    border: 4px solid #22c55e;
    width: 55%;
    height: 18%;
    left: 22%;
    top: 40%;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 25px #22c55e;">
  </div>

  <!-- Estado en cámara -->
  <div id="cam-status" style="
    position:absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    font-size: 11px;
    letter-spacing: 2px;
    padding: 3px 12px;
    border-radius: 20px;
    white-space: nowrap;">
    LISTO
  </div>
</div>

<canvas id="canvas"></canvas>

<button id="btn-start">📷 Iniciar cámara</button>
<button id="btn-auto" disabled>▶ Iniciar scan automático</button>

<div id="resultado">Esperando scan...</div>

<div id="conteo"></div>
<button class="reset-btn" id="btn-reset">↺ Reiniciar conteo</button>

<script>
// ─── ZONAS ML ─────────────────────────────────────────────
const CABA_SET = new Set([...Array.from({length:500},(_,i)=>1000+i)]);

const C1_CPS = new Set([
  1600,1601,1602,1603,1604,1605,1606,1607,1609,
  1624,1636,1637,1638,1640,1641,1642,1643,1644,
  1645,1646,1647,1648,1649,1650,1651,1653,1655,1672,1674,1675,
  1657,1676,1678,1682,1683,1684,1685,1686,1687,
  1688,1692,1702,1704,1706,1708,1712,1713,1714,
  1715,1750,1751,1752,1753,1754,1755,1756,1757,1758,1759,
  1760,1761,1762,1763,1764,1765,1766,1767,1768,1769,1770,1773,1774,1778,
  1820,1821,1822,1823,1824,1825,1826,1827,1828,
  1829,1831,1832,1833,1834,1836,1844,
  1868,1869,1870,1871,1872,1873,1874,1875
]);

const C2_CPS = new Set([
  1608,1610,1611,1612,1613,1614,1615,1616,1617,1618,1621,1659,1670,
  1716,1718,1721,1722,1742,1743,1772,
  1801,1802,1803,1804,1805,
  1838,1839,1840,1841,1842,1846,
  1852,1853,1854,1856,
  1878,1879,1880,1882,1884,1887
]);

const ZONAS = [
  { id:'CABA',     label:'CABA',     color:'#60a5fa' },
  { id:'C1',       label:'CORDÓN 1', color:'#34d399' },
  { id:'C2',       label:'CORDÓN 2', color:'#a78bfa' },
  { id:'INTERIOR', label:'INTERIOR', color:'#fb923c' },
];

function detectarZona(cp) {
  if (CABA_SET.has(cp)) return 'CABA';
  if (C1_CPS.has(cp))   return 'C1';
  if (C2_CPS.has(cp))   return 'C2';
  if (cp >= 1000 && cp <= 9999) return 'INTERIOR';
  return null;
}

// ─── CONTEO ───────────────────────────────────────────────
let conteo = {};
try { conteo = JSON.parse(localStorage.getItem('ml-v3') || '{}'); } catch(e){}
ZONAS.forEach(z => { if (!conteo[z.id]) conteo[z.id] = 0; });
function saveConteo() {
  try { localStorage.setItem('ml-v3', JSON.stringify(conteo)); } catch(e){}
}
function renderConteo() {
  document.getElementById('conteo').innerHTML = ZONAS.map(z => `
    <div class="zona-cell">
      <span style="color:${z.color}">${z.label}</span>
      <span class="zona-num" style="color:${z.color}">${conteo[z.id]||0}</span>
    </div>
  `).join('');
}
renderConteo();

// ─── AUDIO ────────────────────────────────────────────────
let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 1046;
    g.gain.setValueAtTime(0.5, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch(e){}
}

// ─── FLASH ────────────────────────────────────────────────
function flash() {
  document.body.style.background = '#052e16';
  setTimeout(() => document.body.style.background = '#111827', 200);
}

// ─── ELEMENTOS ────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const resultado = document.getElementById('resultado');
const camStatus = document.getElementById('cam-status');

// ─── CÁMARA ───────────────────────────────────────────────
document.getElementById('btn-start').onclick = async () => {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:960} }  // 960 en vez de 1280 — menos carga
    });
    document.getElementById('btn-auto').disabled = false;
  } catch(e) { alert('Error cámara: ' + e.message); }
};

// ─── ANTI DOBLE CONTEO ────────────────────────────────────
let lastCP     = null;
let loopActive = false;
let busy       = false;

// ─── SCAN ─────────────────────────────────────────────────
async function scanFrame() {
  if (!loopActive || busy) return;
  busy = true;

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) { busy = false; setTimeout(scanFrame, 300); return; }

  const MAX_W   = 900;
  const scale   = MAX_W / vw;
  const scaledH = Math.round(vh * scale);

  canvas.width  = MAX_W;
  canvas.height = scaledH;

  const ctx = canvas.getContext('2d');

  // Recorte más pequeño y centrado — menos píxeles, más velocidad
  const cropW = vw * 0.55;
  const cropH = vh * 0.18;
  const cropX = vw * 0.22;
  const cropY = vh * 0.40;

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, MAX_W, scaledH);

  // Preprocesado con CSS filter — grises + contraste + brillo
  ctx.filter = 'grayscale(1) contrast(2) brightness(1.2)';

  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, MAX_W, scaledH);

  ctx.filter = 'none'; // resetear para próximo frame

  camStatus.textContent = 'ESCANEANDO…';

  try {
    const { data: { text } } = await Tesseract.recognize(canvas, 'eng', {
      tessedit_pageseg_mode:      7,   // una sola línea — más rápido que bloque
      tessedit_char_whitelist:    '0123456789CPcp ',
      preserve_interword_spaces:  '0'
    });

    console.log('[OCR]', text);

    // Primero busca "CP:" — preciso
    let m = text.match(/[Cc][Pp][:\s]*(\d{4})/);
    // Fallback: cualquier número de 4 dígitos
    if (!m) m = text.match(/\b(\d{4})\b/);

    const cp = m ? parseInt(m[1]) : null;

    if (cp) {
      camStatus.textContent = `CP ${cp}`;
      if (lastCP === null) {
        lastCP = cp;
        const zona  = detectarZona(cp);
        const zData = ZONAS.find(z => z.id === zona);

        if (zona) {
          conteo[zona] = (conteo[zona]||0) + 1;
          saveConteo();
        }

        beep();
        flash();

        // Vibración Android
        if (navigator.vibrate) navigator.vibrate(80);

        // Resultado grande y claro
        resultado.innerHTML = `
          <div style="font-size:64px;font-weight:bold;color:${zData?.color||'#fff'};line-height:1;">
            ${zData?.label || '?'}
          </div>
          <div style="font-size:30px;margin-top:14px;font-weight:bold;">
            CP ${cp}
          </div>`;

        renderConteo();
      } else {
        camStatus.textContent = 'ESPERANDO NUEVO…';
      }
    } else {
      // Sin CP → etiqueta fuera de cámara → resetear
      if (lastCP !== null) {
        lastCP = null;
        camStatus.textContent = 'LISTO';
      } else {
        camStatus.textContent = 'BUSCANDO…';
      }
    }
  } catch(e) {
    console.error(e);
    camStatus.textContent = 'ERROR';
  }

  busy = false;

  if (loopActive) {
    // Si ya tiene etiqueta detectada espera más antes de volver a escanear
    // Si está buscando, escanea rápido
    const delay = lastCP ? 700 : 120;
    setTimeout(scanFrame, delay);
  }
}

document.getElementById('btn-auto').onclick = function() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (!loopActive) {
    loopActive = true; lastCP = null;
    this.textContent = '⏹ Detener scan';
    this.classList.add('running');
    scanFrame();
  } else {
    loopActive = false; busy = false;
    this.textContent = '▶ Iniciar scan automático';
    this.classList.remove('running');
    camStatus.textContent = 'DETENIDO';
  }
};

document.getElementById('btn-reset').onclick = () => {
  if (!confirm('¿Reiniciar conteo?')) return;
  ZONAS.forEach(z => conteo[z.id] = 0);
  saveConteo(); lastCP = null;
  resultado.innerHTML = 'Conteo reiniciado';
  camStatus.textContent = 'LISTO';
  renderConteo();
};
</script>
</body>
</html>
