<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner ML · Tesseract Rápido</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body { font-family: Arial; background: #111827; color: white; padding: 10px; }
video { width: 100%; border-radius: 10px; }
canvas { display: none; }
button {
  width: 100%; padding: 14px; margin-top: 10px;
  border: none; border-radius: 10px;
  background: #2563eb; color: white; font-size: 18px; cursor: pointer;
}
#btn-auto.running { background: #ef4444; }

/* Cámara compacta sin recorte */
#camara-wrap { position: relative; border-radius: 10px; overflow: hidden; }
#camara-wrap video { width: 100%; max-height: 42vh; object-fit: contain; border-radius: 10px; display: block; background: #000; }

/* Resultado más grande y visible */
#resultado {
  margin-top: 10px; background: #1f2937; padding: 18px 15px;
  border-radius: 10px; text-align: center; min-height: 140px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#conteo {
  margin-top: 10px; background: #1f2937; padding: 10px;
  border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.zona-cell {
  background: #111827; padding: 10px; border-radius: 8px;
  display: flex; justify-content: space-between; align-items: center; font-weight: bold;
}
.zona-num { font-size: 24px; }
.reset-btn { background: transparent !important; border: 1px solid #374151 !important; color: #6b7280 !important; font-size: 14px !important; }

#resumen-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.92); z-index: 100;
  flex-direction: column; align-items: center; justify-content: center; padding: 20px;
}
#resumen-overlay.open { display: flex; }
.resumen-box { background: #1f2937; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; }
.resumen-title { font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #9ca3af; text-align: center; margin-bottom: 16px; }
.resumen-total { text-align: center; font-size: 56px; font-weight: bold; color: #f0c040; line-height: 1; }
.resumen-total-label { text-align: center; font-size: 13px; color: #6b7280; letter-spacing: 2px; margin-bottom: 20px; margin-top: 4px; }
.resumen-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #374151; font-size: 17px; }
.resumen-fila:last-child { border-bottom: none; }
.resumen-pct { font-size: 12px; color: #6b7280; margin-left: 8px; }
.resumen-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.resumen-btn { padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }

#teclado-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 100;
  flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
#teclado-overlay.open { display: flex; }
#teclado-display { font-size: 52px; font-weight: bold; letter-spacing: 12px; color: #f0c040; background: #1f2937; width: 280px; text-align: center; padding: 16px; border-radius: 12px; min-height: 80px; }
#teclado-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 280px; }
.tkey { background: #1f2937; color: white; font-size: 30px; font-weight: bold; padding: 20px 0; border: none; border-radius: 12px; cursor: pointer; text-align: center; }
.tkey:active { background: #374151; transform: scale(0.95); }
.tkey.del    { background: #7f1d1d; font-size: 22px; }
.tkey.cancel { background: #374151; font-size: 18px; grid-column: span 2; }
</style>
</head>
<body>

<h2>📦 Scanner ML · Tesseract ⚡</h2>

<div id="camara-wrap">
  <video id="video" autoplay playsinline></video>
  <!-- Recuadro milimétrico: solo el renglón del CP -->
  <div style="
    position:absolute; border:3px solid #22c55e;
    width:70%; height:14%; left:15%; top:40%;
    border-radius:10px; pointer-events:none;">
  </div>
  <div id="cam-status" style="
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.6); font-size:11px; letter-spacing:2px;
    padding:3px 12px; border-radius:20px; white-space:nowrap;">
    LISTO
  </div>
</div>

<canvas id="canvas"></canvas>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
  <button id="btn-start" style="margin-top:0">📷 Cámara</button>
  <button id="btn-auto"  style="margin-top:0" disabled>▶ Auto scan</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
  <button id="btn-manual" style="background:#7c3aed;margin-top:0">✏️ Manual</button>
  <button id="btn-resumen" style="background:#065f46;margin-top:0">📊 Resumen</button>
</div>

<!-- RESUMEN -->
<div id="resumen-overlay">
  <div class="resumen-box">
    <div class="resumen-title">📊 RESUMEN DEL DÍA</div>
    <div class="resumen-total" id="res-total">0</div>
    <div class="resumen-total-label">PAQUETES TOTALES</div>
    <div id="res-filas"></div>
    <div class="resumen-btns">
      <button class="resumen-btn" id="res-compartir" style="background:#25d366;color:#000">📤 WhatsApp</button>
      <button class="resumen-btn" id="res-cerrar" style="background:#374151;color:#fff">✕ Cerrar</button>
    </div>
  </div>
</div>

<!-- TECLADO -->
<div id="teclado-overlay">
  <div style="color:#9ca3af;font-size:13px;letter-spacing:2px">INGRESÁ EL CP</div>
  <div id="teclado-display">_ _ _ _</div>
  <div id="teclado-grid">
    <button class="tkey" data-n="1">1</button>
    <button class="tkey" data-n="2">2</button>
    <button class="tkey" data-n="3">3</button>
    <button class="tkey" data-n="4">4</button>
    <button class="tkey" data-n="5">5</button>
    <button class="tkey" data-n="6">6</button>
    <button class="tkey" data-n="7">7</button>
    <button class="tkey" data-n="8">8</button>
    <button class="tkey" data-n="9">9</button>
    <button class="tkey del" id="tkey-del">⌫</button>
    <button class="tkey" data-n="0">0</button>
    <button class="tkey cancel" id="tkey-cancel">✕ Cancelar</button>
  </div>
</div>

<div id="resultado">Iniciá la cámara y presioná scan</div>
<div id="conteo"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
  <button class="reset-btn" id="btn-borrar" style="border-color:#7f1d1d;color:#f87171">⌫ Borrar último</button>
  <button class="reset-btn" id="btn-reset">↺ Reiniciar todo</button>
</div>

<script>
// ─── ZONAS ────────────────────────────────────────────────
const CABA_SET = new Set([...Array.from({length:500},(_,i)=>1000+i)]);

const C1_CPS = new Set([
  // San Martín / Vicente López / San Isidro / San Fernando
  1600,1601,1602,1603,1604,1605,1606,1607,1609,
  1624,1636,1637,1638,1640,1641,1642,1643,1644,
  1645,1646,1647,1649,1650,1651,1653,1655,1672,1674,1675,
  // Morón / Ituzaingó / Hurlingham / 3 de Febrero
  1657,1676,1678,1682,1683,1684,1685,1686,1687,
  1688,1692,1702,1704,1706,1708,1712,1713,1714,1715,
  // La Matanza Norte (1750-1756) + ciudad madero zona (1768-1770)
  1750,1751,1752,1753,1754,1756,
  1768,1769,1770,1771,
  // Avellaneda / Lanús / Lomas de Zamora
  1820,1821,1822,1823,1824,1825,1826,1827,1828,
  1829,1831,1832,1833,1834,1836,1844,
  1868,1869,1870,1871,1872,1873,1874,1875
]);

const C2_CPS = new Set([
  // La Matanza Sur (1755,1757 en adelante)
  1755,1757,1758,1759,
  1760,1761,1762,1763,1764,1765,1766,1767,1772,1773,1774,1778,
  // Tigre
  1648,1659,1670,
  // Malvinas Arg / San Miguel / José C. Paz
  1608,1610,1611,1612,1613,1614,1615,1616,1621,
  1622,1623,1663,1664,1665,1666,1667,1668,
  // Moreno (1744-1749)
  1740,1741,1742,1743,1744,1745,1746,1747,1748,1749,
  // Merlo
  1716,1718,1721,1722,
  // Quilmes / Berazategui / Florencio Varela
  1878,1879,1880,1881,1882,1883,1884,1885,1886,1887,1888,1889,
  // Ezeiza / Esteban Echeverría / Almirante Brown
  1801,1802,1803,1804,1805,1806,1807,
  1838,1839,1840,1841,1842,1846,
  1852,1853,1854,1855,1856,1857,1858,
  1812,1813,1814,1815,1816,1817,1818,1819,
]);

const C3_CPS = new Set([
  // Pilar / Escobar
  1629,1630,1631,1632,1633,1634,1635,
  1625,1626,1627,1628,
  1669, // Del Viso (Pilar)
  1619,1620, // Garín (Escobar)
  // Campana / Zárate
  2804,2805,2806,
  2820,2821,2822,
  // Gral Rodríguez
  1727,
  // La Plata / Berisso / Ensenada
  1900,1901,1902,1903,1904,1905,1906,1907,1908,1909,
  1910,1911,1912,1913,1914,1915,1916,1917,1918,1919,
  1920,1921,1922,1923,1924,1925,1926,
  1930,1931,1932,1933,1934
]);

const ZONAS = [
  { id:'CABA', label:'CABA',     color:'#60a5fa' },
  { id:'C1',   label:'CORDÓN 1', color:'#34d399' },
  { id:'C2',   label:'CORDÓN 2', color:'#a78bfa' },
  { id:'C3',   label:'CORDÓN 3', color:'#f472b6' },
];

function detectarZona(cp) {
  if (CABA_SET.has(cp)) return 'CABA';
  if (C1_CPS.has(cp))   return 'C1';
  if (C2_CPS.has(cp))   return 'C2';
  return 'C3';
}

// ─── CONTEO ───────────────────────────────────────────────
let conteo = {};
try { conteo = JSON.parse(localStorage.getItem('ml-tess-rapido') || '{}'); } catch(e){}
ZONAS.forEach(z => { if (!conteo[z.id]) conteo[z.id] = 0; });
function saveConteo() { try { localStorage.setItem('ml-tess-rapido', JSON.stringify(conteo)); } catch(e){} }
function renderConteo() {
  document.getElementById('conteo').innerHTML = ZONAS.map(z => `
    <div class="zona-cell">
      <span style="color:${z.color}">${z.label}</span>
      <span class="zona-num" style="color:${z.color}">${conteo[z.id]||0}</span>
    </div>`).join('');
}
renderConteo();

// ─── AUDIO Y FLASH ────────────────────────────────────────
let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 1046;
    g.gain.setValueAtTime(0.5, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
  } catch(e){}
}
function flash() {
  document.body.style.background = '#052e16';
  setTimeout(() => document.body.style.background = '#111827', 150);
}

// ─── ELEMENTOS ────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const resultado = document.getElementById('resultado');
const camStatus = document.getElementById('cam-status');

// ─── WORKER TESSERACT — carga una sola vez ─────────────────
let ocrWorker = null;
let workerReady = false;

async function initWorker() {
  ocrWorker = await Tesseract.createWorker('eng', 1, {
    logger: () => {}
  });
  await ocrWorker.setParameters({
    tessedit_pageseg_mode:   '7',  // una sola línea — más rápido
    tessedit_char_whitelist: '0123456789', // SOLO números — nada más
  });
  workerReady = true;
}

document.getElementById('btn-start').onclick = async () => {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:640}, height:{ideal:480} }
    });
    camStatus.textContent = 'CARGANDO OCR…';
    document.getElementById('btn-start').textContent = '⏳ Cargando…';
    await initWorker();
    document.getElementById('btn-start').textContent = '✓ Listo';
    document.getElementById('btn-auto').disabled = false;
    camStatus.textContent = 'LISTO';
  } catch(e) { alert('Error: ' + e.message); }
};

// ─── HISTORIAL ────────────────────────────────────────────
let historial = [];

function registrarZona(cp, zona, zData) {
  conteo[zona] = (conteo[zona]||0) + 1;
  historial.push(zona);
  saveConteo();
  beep(); flash();
  camStatus.textContent = `✓ CP ${cp}`;
  resultado.innerHTML = `
    <div style="font-size:72px;font-weight:bold;color:${zData?.color||'#fff'};line-height:1">
      ${zData?.label||'?'}
    </div>
    <div style="font-size:28px;margin-top:10px;font-weight:bold;color:#9ca3af">CP ${cp}</div>`;
  renderConteo();
}

// ─── SCAN MILIMÉTRICO ─────────────────────────────────────
let lastCP = null, noDetectCount = 0, loopActive = false, busy = false;

async function scanFrame() {
  if (!loopActive || busy || !workerReady) return;
  busy = true;

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) { busy = false; setTimeout(scanFrame, 100); return; }

  // Recorte milimétrico: solo el renglón del CP (10% alto)
  // Escalado a 800px ancho para que Tesseract lea bien los números grandes
  const cropW = vw * 0.70;
  const cropH = vh * 0.10;
  const cropX = vw * 0.15;
  const cropY = vh * 0.44;

  const TARGET_W = 800;
  const scale    = TARGET_W / cropW;

  canvas.width  = TARGET_W;
  canvas.height = Math.round(cropH * scale);

  const ctx = canvas.getContext('2d');

  // Fondo blanco + binarizado
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

  // Binarizado pixel a pixel
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const b = 0.34*data[i] + 0.5*data[i+1] + 0.16*data[i+2];
    const v = b < 128 ? 0 : 255;
    data[i] = data[i+1] = data[i+2] = v;
    data[i+3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);

  camStatus.textContent = 'ESCANEANDO…';

  try {
    const { data: { text } } = await ocrWorker.recognize(canvas);
    console.log('[TESS]', text.trim());

    // Con whitelist solo números, buscar directamente 4 dígitos juntos
    const match = text.match(/\d{4}/);
    let cp = match ? parseInt(match[0]) : null;
    if (cp === 1052) cp = null; // ignorar remitente

    if (cp && cp >= 1000 && cp <= 9999) {
      if (cp === lastCP) {
        camStatus.textContent = 'ESPERANDO NUEVO…';
        noDetectCount = 0;
      } else {
        lastCP = cp;
        noDetectCount = 0;
        const zona  = detectarZona(cp);
        const zData = ZONAS.find(z => z.id === zona);
        registrarZona(cp, zona, zData);
      }
    } else {
      noDetectCount++;
      if (noDetectCount >= 3) {
        if (lastCP !== null) { lastCP = null; camStatus.textContent = 'LISTO'; }
        else camStatus.textContent = 'BUSCANDO…';
        noDetectCount = 0;
      }
    }
  } catch(e) { console.error(e); }

  busy = false;
  if (loopActive) setTimeout(scanFrame, lastCP ? 800 : 100);
}

document.getElementById('btn-auto').onclick = function() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (!loopActive) {
    loopActive = true; lastCP = null; noDetectCount = 0;
    this.textContent = '⏹ Detener';
    this.classList.add('running');
    scanFrame();
  } else {
    loopActive = false; busy = false;
    this.textContent = '▶ Auto scan';
    this.classList.remove('running');
    camStatus.textContent = 'DETENIDO';
  }
};

// ─── BORRAR ÚLTIMO ────────────────────────────────────────
document.getElementById('btn-borrar').onclick = () => {
  if (historial.length === 0) { alert('No hay registros para borrar.'); return; }
  const ultimaZona = historial[historial.length-1];
  const zData = ZONAS.find(z => z.id === ultimaZona);
  if (!confirm(`¿Borrar último registro?\n(${zData?.label||ultimaZona})`)) return;
  historial.pop();
  if (conteo[ultimaZona] > 0) conteo[ultimaZona]--;
  saveConteo(); lastCP = null;
  resultado.innerHTML = `<div style="color:#f87171;font-size:18px">⌫ Último registro borrado</div>`;
  renderConteo();
};

// ─── REINICIAR ────────────────────────────────────────────
document.getElementById('btn-reset').onclick = () => {
  if (!confirm('¿Reiniciar conteo?')) return;
  ZONAS.forEach(z => conteo[z.id] = 0);
  saveConteo(); lastCP = null; noDetectCount = 0; historial = [];
  resultado.innerHTML = 'Conteo reiniciado';
  camStatus.textContent = 'LISTO';
  renderConteo();
};

// ─── RESUMEN ─────────────────────────────────────────────
const resumenOverlay = document.getElementById('resumen-overlay');
function abrirResumen() {
  const total = ZONAS.reduce((s,z) => s+(conteo[z.id]||0), 0);
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-filas').innerHTML = ZONAS.map(z => {
    const n = conteo[z.id]||0;
    const pct = total > 0 ? Math.round(n*100/total) : 0;
    return `<div class="resumen-fila">
      <span style="color:${z.color};font-weight:bold">${z.label}</span>
      <span>
        <span style="font-size:22px;font-weight:bold;color:${z.color}">${n}</span>
        <span class="resumen-pct">${pct}%</span>
      </span>
    </div>`;
  }).join('');
  resumenOverlay.classList.add('open');
}
document.getElementById('btn-resumen').onclick = abrirResumen;
document.getElementById('res-cerrar').onclick = () => resumenOverlay.classList.remove('open');
document.getElementById('res-compartir').onclick = () => {
  const total = ZONAS.reduce((s,z) => s+(conteo[z.id]||0), 0);
  const fecha = new Date().toLocaleDateString('es-AR');
  let msg = `📦 *RESUMEN FLEX — ${fecha}*\n━━━━━━━━━━━━━━━━\n`;
  ZONAS.forEach(z => {
    const n = conteo[z.id]||0;
    const pct = total > 0 ? Math.round(n*100/total) : 0;
    msg += `${z.label}: *${n}* paquetes (${pct}%)\n`;
  });
  msg += `━━━━━━━━━━━━━━━━\n*TOTAL: ${total} paquetes*`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
};

// ─── TECLADO MANUAL ──────────────────────────────────────
const overlay = document.getElementById('teclado-overlay');
const display = document.getElementById('teclado-display');
let tecladoInput = '';
function updateDisplay() {
  const d = tecladoInput.padEnd(4,'_');
  display.textContent = d[0]+' '+d[1]+' '+d[2]+' '+d[3];
}
function tecladoRegistrar(cp) {
  const zona  = detectarZona(cp);
  const zData = ZONAS.find(z => z.id === zona);
  registrarZona(cp, zona, zData);
  resultado.innerHTML += '<div style="font-size:13px;color:#9ca3af;margin-top:6px">✏️ ingresado manual</div>';
  tecladoInput = '';
  overlay.classList.remove('open');
}
document.getElementById('teclado-grid').addEventListener('click', e => {
  const btn = e.target.closest('.tkey');
  if (!btn) return;
  const n = btn.dataset.n;
  if (n !== undefined && tecladoInput.length < 4) {
    tecladoInput += n;
    updateDisplay();
    if (tecladoInput.length === 4) setTimeout(() => tecladoRegistrar(parseInt(tecladoInput)), 200);
  }
});
document.getElementById('tkey-del').onclick = () => { tecladoInput = tecladoInput.slice(0,-1); updateDisplay(); };
document.getElementById('tkey-cancel').onclick = () => { tecladoInput = ''; overlay.classList.remove('open'); };
document.getElementById('btn-manual').onclick = () => { tecladoInput = ''; updateDisplay(); overlay.classList.add('open'); };
</script>
</body>
</html>
